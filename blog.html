<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfeeff">
  <meta name="description" content="Read Anas's published stories on LonoBlog.">
  <title>The Blog — LonoBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --blonde: #f6f3ff;
      --taupe: #7f94b0;
      --light-brown: #c5d8f0;
      --true-brown: #6a86ae;
      --dark-chocolate: #1f3558;
      --espresso: #10233d;
      --auburn: #5c8ecb;
      --ash: #49627d;
      --paper: #edf6ff;
      --surface: rgba(255,255,255,0.58);
      --ink: var(--espresso);
      --line: rgba(90, 120, 160, 0.32);
      --sans: "Segoe UI", "Trebuchet MS", "Verdana", sans-serif;
      --display: "Segoe UI", "Trebuchet MS", "Verdana", sans-serif;
      --mono: "Consolas", "SFMono-Regular", monospace;
      --radius-card: 28px;
      --radius-control: 16px;
      --radius-pill: 999px;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(rgba(237, 246, 255, 0.18), rgba(242, 238, 255, 0.26)),
        url("/static/frutiger-aero-landscape.png") center / cover fixed,
        linear-gradient(180deg, #edf7ff 0%, #e4f0ff 36%, #f4ecff 100%);
    }
    body::before, body::after {
      position: fixed;
      top: 25%;
      z-index: 0;
      width: 132px;
      height: 220px;
      background-image:
        radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.95) 0 4%, rgba(255,255,255,.35) 7%, transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(197,236,255,.26) 0 54%, rgba(255,255,255,.4) 63%, rgba(255,255,255,.88) 68%, rgba(127,207,241,.48) 71%, rgba(255,255,255,.18) 75%, transparent 78%),
        radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.95) 0 4%, rgba(255,255,255,.35) 7%, transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(197,236,255,.26) 0 54%, rgba(255,255,255,.4) 63%, rgba(255,255,255,.88) 68%, rgba(127,207,241,.48) 71%, rgba(255,255,255,.18) 75%, transparent 78%),
        radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.95) 0 4%, rgba(255,255,255,.35) 7%, transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(197,236,255,.26) 0 54%, rgba(255,255,255,.4) 63%, rgba(255,255,255,.88) 68%, rgba(127,207,241,.48) 71%, rgba(255,255,255,.18) 75%, transparent 78%);
      background-repeat: no-repeat;
      background-position: 0 2px, 0 2px, 70px 90px, 70px 90px, 20px 158px, 20px 158px;
      background-size: 74px 74px, 74px 74px, 48px 48px, 48px 48px, 34px 34px, 34px 34px;
      content: "";
      filter: drop-shadow(0 8px 14px rgba(50,90,130,.14));
      opacity: .82;
      pointer-events: none;
    }
    body::before { left: max(8px, calc((100vw - 1480px) / 2)); }
    body::after { top: 42%; right: max(8px, calc((100vw - 1480px) / 2)); transform: scaleX(-1); }
    .shell { position: relative; z-index: 1; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--auburn); outline-offset: 4px; }
    .shell { width: min(900px, calc(100% - 40px)); min-height: 100vh; margin-inline: auto; display: flex; flex-direction: column; }
    .site-header {
      min-height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 14px;
      padding: 0 18px;
      border: 1px solid rgba(99, 123, 171, 0.26);
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 30px rgba(60, 90, 132, 0.08);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--espresso); font-size: 16px; font-weight: 700; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(77, 100, 140, 0.22);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(180,214,255,0.72));
      color: var(--espresso);
      font: 700 12px var(--display);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82), 0 8px 18px rgba(78, 104, 145, 0.14);
    }
    .nav { display: flex; gap: 22px; color: var(--true-brown); font-size: 12px; font-weight: 600; }
    .nav a { padding: 9px 13px; border-radius: var(--radius-pill); transition: background .18s ease, color .18s ease; }
    .nav a:hover { background: rgba(255,255,255,0.52); color: var(--auburn); }
    main { flex: 1; padding: 54px 0 64px; }
    .eyebrow { margin: 0 0 10px; color: var(--auburn); font: 500 10px var(--mono); text-transform: uppercase; }
    .title-row { display: flex; align-items: center; gap: 20px; }
    h1 { margin: 0; color: var(--dark-chocolate); font: 600 clamp(38px, 7vw, 62px)/1.05 var(--display); }
    .intro { max-width: 570px; margin: 14px 0 32px; color: var(--ash); font-size: 14px; line-height: 1.8; }
    .doodle { flex: none; color: var(--auburn); }
    .doodle-squiggle { width: 86px; height: 35px; margin-top: 7px; }
    .doodle-spark {
      width: 42px;
      height: 42px;
      margin-left: auto;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.74);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,0.72), rgba(207,231,255,0.28));
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 7px 18px rgba(41,86,130,0.16);
      backdrop-filter: blur(5px);
    }
    .doodle-strip { position: relative; height: 150px; margin: -11px 0 22px; pointer-events: none; }
    .doodle-strip svg {
      position: absolute;
      width: 46px;
      height: 46px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,0.76), rgba(205,231,255,0.34));
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.94), 0 8px 20px rgba(41,86,130,0.17);
      color: var(--auburn);
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .94;
      backdrop-filter: blur(5px);
    }
    .doodle-strip svg:nth-child(1) { top: 3%; left: 2%; transform: rotate(-13deg); }
    .doodle-strip svg:nth-child(2) { top: 46%; left: 8%; transform: rotate(12deg) scale(.9); }
    .doodle-strip svg:nth-child(3) { top: 12%; left: 16%; transform: rotate(-8deg) scale(1.1); }
    .doodle-strip svg:nth-child(4) { top: 66%; left: 23%; transform: rotate(9deg); }
    .doodle-strip svg:nth-child(5) { top: 2%; left: 31%; transform: rotate(12deg) scale(.85); }
    .doodle-strip svg:nth-child(6) { top: 47%; left: 38%; transform: rotate(-11deg); }
    .doodle-strip svg:nth-child(7) { top: 13%; left: 46%; transform: rotate(7deg) scale(1.05); }
    .doodle-strip svg:nth-child(8) { top: 66%; left: 53%; transform: rotate(-7deg); }
    .doodle-strip svg:nth-child(9) { top: 1%; left: 61%; transform: rotate(14deg); }
    .doodle-strip svg:nth-child(10) { top: 46%; left: 68%; transform: rotate(-9deg) scale(.9); }
    .doodle-strip svg:nth-child(11) { top: 14%; left: 76%; transform: rotate(11deg); }
    .doodle-strip svg:nth-child(12) { top: 65%; left: 83%; transform: rotate(-12deg) scale(1.1); }
    .doodle-strip svg:nth-child(13) { top: 3%; left: 92%; transform: rotate(8deg); }
    .doodle-strip svg:nth-child(14) { top: 47%; left: 96%; transform: rotate(-5deg) scale(.85); }
    .doodle-strip svg:nth-child(15) { top: 72%; left: 2%; transform: rotate(10deg) scale(.9); }
    .doodle-strip svg:nth-child(16) { top: 34%; left: 27%; transform: rotate(-8deg); }
    .doodle-strip svg:nth-child(17) { top: 75%; left: 43%; transform: rotate(14deg); }
    .doodle-strip svg:nth-child(18) { top: 34%; left: 59%; transform: rotate(-12deg) scale(1.05); }
    .doodle-strip svg:nth-child(19) { top: 76%; left: 72%; transform: rotate(8deg); }
    .doodle-strip svg:nth-child(20) { top: 34%; left: 88%; transform: rotate(-9deg); }
    .doodle-strip svg:nth-child(3n) { color: var(--true-brown); }
    .doodle-strip svg:nth-child(3n + 2) { color: var(--light-brown); }
    .blog-tools { display: grid; grid-template-columns: minmax(0, 1fr) 170px 170px; gap: 12px; margin-bottom: 18px; }
    .blog-tools label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .blog-tools input, .blog-tools select { min-height: 46px; width: 100%; padding: 0 15px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); font: 12px var(--sans); }
    .blog-tools input:focus-visible, .blog-tools select:focus-visible { outline: 3px solid var(--auburn); outline-offset: 3px; }
    .results-count { min-height: 17px; margin: 0 0 11px; color: var(--ash); font: 10px var(--mono); }
    .story-list { display: grid; gap: 16px; }
    .story {
      position: relative;
      padding: clamp(22px, 4vw, 36px);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: rgba(255,255,255,0.28);
      box-shadow: 0 18px 38px rgba(68, 96, 130, 0.08);
      backdrop-filter: blur(12px);
    }
    .story-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--true-brown); font: 10px var(--mono); text-transform: uppercase; }
    .story-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .story h2 { margin: 0 0 10px; color: var(--dark-chocolate); font: 600 clamp(23px, 4vw, 32px)/1.2 var(--display); }
    .excerpt { margin: 0 0 20px; color: var(--ash); font-size: 14px; line-height: 1.7; }
    .story-body { padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink); font-size: 14px; line-height: 1.9; overflow-wrap: anywhere; }
    .story-body p { margin: 0 0 16px; }
    .story-body p:last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.2em 0 .5em; color: var(--dark-chocolate); line-height: 1.25; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.6em; }
    .markdown-body blockquote { margin: 1em 0; padding: .2em 1em; border-left: 3px solid var(--light-brown); color: var(--ash); }
    .markdown-body table { width: 100%; margin: 16px 0; border-collapse: collapse; text-align: left; }
    .markdown-body th, .markdown-body td { padding: 8px 10px; border: 1px solid var(--line); }
    .markdown-body th { background: var(--paper); color: var(--dark-chocolate); }
    .markdown-body input[type="checkbox"] { margin-right: 7px; accent-color: var(--auburn); }
    .markdown-body pre { overflow-x: auto; padding: 14px; border-radius: 12px; background: var(--paper); font: 12px/1.6 var(--mono); }
    .markdown-body code { padding: .12em .3em; border-radius: 4px; background: var(--blonde); font: .9em var(--mono); }
    .markdown-body pre code { padding: 0; background: transparent; }
    .markdown-body a { color: var(--auburn); text-decoration: underline; text-underline-offset: 2px; }
    .markdown-body img { display: block; max-width: 100%; height: auto; margin: 18px auto; border-radius: 12px; }
    .story-tools { display: flex; justify-content: flex-end; margin-top: 18px; }
    .story-tools { justify-content: space-between; align-items: center; gap: 12px; }
    .story-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .share-button { min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: transparent; color: var(--true-brown); cursor: pointer; font: 10px var(--mono); text-transform: uppercase; }
    .share-button:hover { border-color: var(--auburn); color: var(--auburn); }
    .like-button { min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: transparent; color: var(--true-brown); cursor: pointer; font: 10px var(--mono); }
    .like-button:hover, .like-button[aria-pressed="true"] { border-color: var(--auburn); color: var(--auburn); }
    .like-button svg { width: 16px; height: 16px; }
    .comment-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .comment-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px; color: var(--dark-chocolate); font: 600 16px var(--display); }
    .comment-count { color: var(--ash); font: 10px var(--mono); }
    .comment-list { display: grid; gap: 10px; margin-bottom: 16px; }
    .comment { padding: 13px 16px; border: 1px solid var(--line); border-left: 3px solid var(--light-brown); border-radius: 8px var(--radius-control) var(--radius-control) 8px; background: var(--paper); }
    .comment-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; color: var(--true-brown); font: 10px var(--mono); }
    .comment p { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .comment-delete { margin-top: 9px; padding: 0; border: 0; background: transparent; color: #a44255; cursor: pointer; font: 10px var(--mono); text-decoration: underline; }
    .comment-delete:disabled { cursor: wait; opacity: .65; }
    .comment-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: start; }
    .comment-form input, .comment-form textarea { width: 100%; min-height: 42px; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); font: 12px var(--sans); }
    .comment-form textarea { min-height: 42px; resize: vertical; }
    .comment-message { display: grid; gap: 6px; }
    .comment-emoji-bar { display: flex; flex-wrap: wrap; gap: 4px; }
    .comment-emoji-bar button {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(191,224,255,.42));
      box-shadow: inset 0 1px 2px rgba(255,255,255,.94), 0 4px 10px rgba(41,86,130,.12);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .comment-emoji-bar button:hover { transform: translateY(-2px); box-shadow: inset 0 1px 2px rgba(255,255,255,.94), 0 7px 14px rgba(41,86,130,.2); }
    .comment-form > button { min-height: 42px; padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: var(--dark-chocolate); color: var(--surface); cursor: pointer; font: 600 10px var(--mono); }
    .comment-form > button:disabled { cursor: wait; opacity: .65; }
    .comment-status { min-height: 16px; margin: 8px 0 0; color: var(--ash); font-size: 11px; }
    .results-count { display: flex; justify-content: space-between; align-items: center; }
    .results-count p { margin: 0; }
    .results-doodle {
      width: 42px;
      height: 36px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,0.72), rgba(207,231,255,0.28));
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 7px 18px rgba(41,86,130,0.14);
      color: var(--auburn);
      backdrop-filter: blur(5px);
    }
    .message { padding: 24px; border: 1px dashed var(--taupe); border-radius: var(--radius-card); color: var(--ash); font-size: 13px; line-height: 1.7; }
    .site-footer { width: 100vw; min-height: 76px; flex: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: auto calc(50% - 50vw) 0; padding: 0 max(20px, calc((100vw - 900px) / 2)); border: 0; border-top: 1px solid rgba(90,120,160,.2); border-radius: 0; background: #fff; color: var(--ash); font-size: 10px; }
    .site-footer a { color: var(--auburn); font-weight: 600; }
    @media (max-width: 520px) {
      .site-header { min-height: 66px; }
      .nav { gap: 13px; font-size: 10px; }
      main { padding-top: 38px; }
      .title-row { gap: 10px; }
      .doodle-squiggle { width: 54px; }
      .blog-tools { grid-template-columns: 1fr; }
      .results-count { align-items: flex-start; }
      .doodle-strip { height: 160px; margin-bottom: 20px; }
      .doodle-strip svg { width: 40px; height: 40px; padding: 9px; }
      .comment-form { grid-template-columns: 1fr; }
      .site-footer { align-items: flex-start; flex-direction: column; justify-content: center; padding: 14px 20px; }
    }
    @media (max-width: 760px) {
      body::before, body::after { display: none; }
    }
  </style>
</head>

        <svg viewBox="0 0 32 32" fill="none"><path d="M5 7c5-4 17-4 22 0v19c-5-4-17-4-22 0V7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 7v19" stroke="currentColor" stroke-width="2"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 12h14l-1 15H10L9 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 12a4 4 0 0 1 8 0m-3-9c4 3-4 4 0 7m6 3 3-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 4c-5 0-9 4-9 9 0 4 2 6 4 8v4h10v-4c2-2 4-4 4-8 0-5-4-9-9-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 29h8m-7-8h6m-9-8c0-3 2-5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="2"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3m0-20-3 3M9 23l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="m3 24 8-10 5 6 5-9 8 13H3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m21 7 1-3m5 5 3-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M25 20a8 8 0 0 1-12-10A10 10 0 1 0 25 20Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m22 5 .7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 28V13m0 8c-7 0-10-4-10-10 7 0 10 4 10 10Zm0-4c0-7 4-10 10-10 0 7-4 10-10 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M5 23c0-3 3-5 6-5 1-5 8-7 11-3 5-1 8 3 6 7-1 3-4 4-7 4H11c-4 0-6-1-6-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="m16 3 3.5 8.5L28 15l-8.5 3.5L16 27l-3.5-8.5L4 15l8.5-3.5L16 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m27 24 1 2.5 2.5 1-2.5 1L27 31l-1-2.5-2.5-1 2.5-1 1-2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 32 32" fill="none"><path d="M7 4h18v24l-9-6-9 6V4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 10h10m-10 5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="blog-tools">
        <label for="story-search">Search published stories</label>
        <input id="story-search" type="search" placeholder="Search stories..." autocomplete="off">
        <label for="category-filter">Filter by category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
        </select>
        <label for="sort-order">Sort stories</label>
        <select id="sort-order">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <div class="results-count">
        <p id="results-count" role="status" aria-live="polite"></p>
        <svg class="results-doodle" viewBox="0 0 40 28" fill="none" aria-hidden="true">
          <path d="M3 22c6-15 11-15 16-5s8 10 17-6M29 10l7 1 1-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <section class="story-list" id="story-list" aria-label="Published blog posts" aria-live="polite">
        <p class="message">Loading stories...</p>
      </section>
    </main>
    <footer class="site-footer"><span>LonoBlog · Anas’s personal blog</span><a href="/">Back to home</a></footer>
  </div>
  <script src="/markdown.js"></script>
  <script>
    const storyList = document.querySelector("#story-list");
    const searchInput = document.querySelector("#story-search");
    const categoryFilter = document.querySelector("#category-filter");
    const sortOrder = document.querySelector("#sort-order");
    const resultsCount = document.querySelector("#results-count");
    let allStories = [];
    let canManageComments = false;

    function showMessage(message) {
      const notice = document.createElement("p");
      notice.className = "message";
      notice.textContent = message;
      storyList.replaceChildren(notice);
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          Accept: "application/json",
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...options.headers
        }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `Request failed (HTTP ${response.status}).`);
      return result;
    }

    function renderComment(comment, list, countLabel, status) {
      const item = document.createElement("article");
      item.className = "comment";
      const meta = document.createElement("div");
      meta.className = "comment-meta";
      const name = document.createElement("strong");
      name.textContent = comment.name;
      const date = document.createElement("time");
      date.dateTime = comment.createdAt;
      date.textContent = new Date(comment.createdAt).toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      meta.append(name, date);
      const body = document.createElement("p");
      body.textContent = comment.body;
      item.append(meta, body);
      if (canManageComments) {
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "comment-delete";
        deleteButton.textContent = "Delete comment";
        deleteButton.setAttribute("aria-label", `Delete comment by ${comment.name}`);
        deleteButton.addEventListener("click", async () => {
          if (!window.confirm(`Delete this comment by ${comment.name}?`)) return;
          deleteButton.disabled = true;
          status.textContent = "";
          try {
            await apiRequest(`/api/comments/${encodeURIComponent(comment.id)}`, { method: "DELETE" });
            item.remove();
            const remaining = list.children.length;
            countLabel.textContent = `${remaining} ${remaining === 1 ? "comment" : "comments"}`;
            status.textContent = "Comment deleted.";
          } catch (error) {
            status.textContent = `Comment could not be deleted: ${error.message}`;
            deleteButton.disabled = false;
          }
        });
        item.append(deleteButton);
      }
      return item;
    }

    async function loadComments(storyId, list, countLabel, status) {
      try {
        const comments = await apiRequest(`/api/public/stories/${encodeURIComponent(storyId)}/comments`);
        list.replaceChildren(...comments.map((comment) => renderComment(comment, list, countLabel, status)));
        countLabel.textContent = `${comments.length} ${comments.length === 1 ? "comment" : "comments"}`;
      } catch (error) {
        list.replaceChildren();
        status.textContent = `Comments could not be loaded: ${error.message}`;
      }
    }

    function renderStories() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const category = categoryFilter.value;
      const stories = allStories.filter((story) => {
        const matchesCategory = category === "all" || story.category === category;
        const searchableText = [story.title, story.excerpt, story.body, story.category]
          .join(" ")
          .toLocaleLowerCase();
        return matchesCategory && searchableText.includes(query);
      });
      stories.sort((first, second) => {
        const dateOrder = first.updatedAt.localeCompare(second.updatedAt);
        return sortOrder.value === "oldest" ? dateOrder : -dateOrder;
      });

      resultsCount.textContent = `${stories.length} ${stories.length === 1 ? "story" : "stories"}`;
      if (!allStories.length) {
        showMessage("No stories have been published yet. Check back soon.");
        return;
      }
      if (!stories.length) {
        showMessage("No stories match your search. Try another word or category.");
        return;
      }

      const articles = stories.map((story) => {
        const article = document.createElement("article");
        article.className = "story";
        article.id = `story-${story.id}`;
        const meta = document.createElement("div");
        meta.className = "story-meta";
        const category = document.createElement("span");
        category.textContent = story.category;
        const date = document.createElement("time");
        date.dateTime = story.updatedAt;
        date.textContent = new Date(story.updatedAt).toLocaleDateString(undefined, {
          month: "long",
          day: "numeric",
          year: "numeric"
        });
        const wordCount = story.body.trim() ? story.body.trim().split(/\s+/).length : 0;
        const readingTime = document.createElement("span");
        readingTime.textContent = `${Math.max(1, Math.ceil(wordCount / 220))} min read`;
        meta.append(category, date, readingTime);

        const headingRow = document.createElement("div");
        headingRow.className = "story-heading";
        const title = document.createElement("h2");
        title.textContent = story.title;
        const spark = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        spark.setAttribute("class", "doodle doodle-spark");
        spark.setAttribute("viewBox", "0 0 40 40");
        spark.setAttribute("fill", "none");
        spark.setAttribute("aria-hidden", "true");
        const sparkPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        sparkPath.setAttribute("d", "M20 2c1 11 5 15 18 18-13 2-17 6-18 18C18 26 14 22 2 20 14 17 18 13 20 2Z");
        sparkPath.setAttribute("stroke", "currentColor");
        sparkPath.setAttribute("stroke-width", "2");
        sparkPath.setAttribute("stroke-linejoin", "round");
        spark.append(sparkPath);
        headingRow.append(title, spark);
        article.append(meta, headingRow);

        if (story.excerpt) {
          const excerpt = document.createElement("p");
          excerpt.className = "excerpt";
          excerpt.textContent = story.excerpt;
          article.append(excerpt);
        }

        const body = document.createElement("div");
        body.className = "story-body markdown-body";
        window.renderMarkdown(body, story.body);
        article.append(body);
        const tools = document.createElement("div");
        tools.className = "story-tools";
        const storyActions = document.createElement("div");
        storyActions.className = "story-actions";
        const likeButton = document.createElement("button");
        likeButton.type = "button";
        likeButton.className = "like-button";
        likeButton.setAttribute("aria-pressed", String(story.liked));
        likeButton.setAttribute("aria-label", story.liked ? "Unlike this story" : "Like this story");
        const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        heart.setAttribute("viewBox", "0 0 24 24");
        heart.setAttribute("aria-hidden", "true");
        const heartPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        heartPath.setAttribute("d", "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z");
        heartPath.setAttribute("fill", story.liked ? "currentColor" : "none");
        heartPath.setAttribute("stroke", "currentColor");
        heartPath.setAttribute("stroke-width", "1.8");
        heart.append(heartPath);
        const likeCount = document.createElement("span");
        likeCount.textContent = String(story.likesCount);
        likeButton.append(heart, likeCount);
        likeButton.addEventListener("click", async () => {
          likeButton.disabled = true;
          try {
            const result = await apiRequest(`/api/public/stories/${encodeURIComponent(story.id)}/like`, {
              method: "POST"
            });
            story.liked = result.liked;
            story.likesCount = result.likesCount;
            likeButton.setAttribute("aria-pressed", String(story.liked));
            likeButton.setAttribute("aria-label", story.liked ? "Unlike this story" : "Like this story");
            heartPath.setAttribute("fill", story.liked ? "currentColor" : "none");
            likeCount.textContent = String(story.likesCount);
          } catch (error) {
            commentStatus.textContent = `Like could not be saved: ${error.message}`;
          } finally {
            likeButton.disabled = false;
          }
        });
        const shareButton = document.createElement("button");
        shareButton.type = "button";
        shareButton.className = "share-button";
        shareButton.textContent = "Copy post link";
        shareButton.addEventListener("click", async () => {
          const postUrl = new URL(window.location.href);
          postUrl.hash = article.id;
          try {
            await navigator.clipboard.writeText(postUrl.href);
            resultsCount.textContent = `Link copied for “${story.title}”.`;
          } catch (error) {
            resultsCount.textContent = `Could not copy the link: ${error.message}`;
          }
        });
        storyActions.append(likeButton, shareButton);
        tools.append(storyActions);

        const commentSection = document.createElement("section");
        commentSection.className = "comment-section";
        const commentHeading = document.createElement("h3");
        commentHeading.className = "comment-heading";
        const commentTitle = document.createElement("span");
        commentTitle.textContent = "Join the conversation";
        const commentCount = document.createElement("span");
        commentCount.className = "comment-count";
        commentHeading.append(commentTitle, commentCount);
        const commentList = document.createElement("div");
        commentList.className = "comment-list";
        const commentStatus = document.createElement("p");
        commentStatus.className = "comment-status";
        commentStatus.setAttribute("role", "status");
        commentStatus.setAttribute("aria-live", "polite");
        const commentForm = document.createElement("form");
        commentForm.className = "comment-form";
        const nameInput = document.createElement("input");
        nameInput.name = "name";
        nameInput.type = "text";
        nameInput.maxLength = 60;
        nameInput.placeholder = "Your name";
        nameInput.autocomplete = "name";
        nameInput.required = true;
        const bodyInput = document.createElement("textarea");
        bodyInput.name = "body";
        bodyInput.maxLength = 1000;
        bodyInput.placeholder = "Write a comment...";
        bodyInput.rows = 1;
        bodyInput.required = true;
        const commentMessage = document.createElement("div");
        commentMessage.className = "comment-message";
        const emojiBar = document.createElement("div");
        emojiBar.className = "comment-emoji-bar";
        emojiBar.setAttribute("aria-label", "Insert an emoji");
        const emojiLabel = document.createElement("span");
        emojiLabel.textContent = "Add an emoji";
        emojiBar.append(emojiLabel);
        ["😊", "❤️", "✨", "🌱", "☕", "🌿", "😄", "🎉"].forEach((emoji) => {
          const emojiButton = document.createElement("button");
          emojiButton.type = "button";
          emojiButton.textContent = emoji;
          emojiButton.setAttribute("aria-label", `Insert ${emoji}`);
          emojiButton.addEventListener("click", () => window.insertEmojiAtCursor(bodyInput, emoji));
          emojiBar.append(emojiButton);
        });
        commentMessage.append(bodyInput, emojiBar);
        const submitComment = document.createElement("button");
        submitComment.type = "submit";
        submitComment.textContent = "Comment";
        commentForm.append(nameInput, commentMessage, submitComment);
        commentForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          submitComment.disabled = true;
          commentStatus.textContent = "";
          try {
            const comment = await apiRequest(
              `/api/public/stories/${encodeURIComponent(story.id)}/comments`,
              {
                method: "POST",
                body: JSON.stringify({ name: nameInput.value, body: bodyInput.value })
              }
            );
            commentList.append(renderComment(comment, commentList, commentCount, commentStatus));
            const nextCount = (Number.parseInt(commentCount.textContent, 10) || 0) + 1;
            commentCount.textContent = `${nextCount} ${nextCount === 1 ? "comment" : "comments"}`;
            story.commentsCount = nextCount;
            bodyInput.value = "";
            commentStatus.textContent = "Your comment is now visible.";
          } catch (error) {
            commentStatus.textContent = error.message;
          } finally {
            submitComment.disabled = false;
          }
        });
        commentSection.append(commentHeading, commentList, commentStatus, commentForm);
        article.append(tools, commentSection);
        loadComments(story.id, commentList, commentCount, commentStatus);
        return article;
      });
      storyList.replaceChildren(...articles);
      const sharedPostId = window.location.hash.slice(1);
      if (sharedPostId) {
        document.getElementById(sharedPostId)?.scrollIntoView({ block: "start" });
      }
    }

    searchInput.addEventListener("input", renderStories);
    categoryFilter.addEventListener("change", renderStories);
    sortOrder.addEventListener("change", renderStories);

    Promise.all([
      fetch("/api/public/stories", { headers: { Accept: "application/json" } }).then((response) => {
        if (!response.ok) throw new Error(`The blog could not be loaded (HTTP ${response.status}).`);
        return response.json();
      }),
      apiRequest("/api/session").catch((error) => {
        resultsCount.textContent = `Owner controls unavailable: ${error.message}`;
        return { authenticated: false };
      })
    ])
      .then(([stories, sessionStatus]) => {
        allStories = stories;
        canManageComments = sessionStatus.authenticated === true;
        const categories = [...new Set(stories.map((story) => story.category))].sort((a, b) => a.localeCompare(b));
        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          categoryFilter.append(option);
        });
        renderStories();
      })
      .catch((error) => {
        resultsCount.textContent = "";
        showMessage(error.message);
      });
  </script>
</body>
</html>
