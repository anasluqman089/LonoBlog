<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfeeff">
  <meta name="description" content="A collection of projects by Anas.">
  <title>Projects — LonoBlog</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #10233d;
      --navy: #1f3558;
      --blue: #5c8ecb;
      --muted: #49627d;
      --line: rgba(90, 120, 160, .3);
      --sans: "Segoe UI", "Trebuchet MS", Verdana, sans-serif;
      font-family: var(--sans);
      color: var(--ink);
      background: #edf6ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(rgba(237,246,255,.2), rgba(242,238,255,.28)),
        url("/static/frutiger-aero-landscape.png") center / cover fixed,
        #edf6ff;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .shell { width: min(1040px, calc(100% - 44px)); margin-inline: auto; }
    .site-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.55);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); font-size: 16px; font-weight: 700; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(77,100,140,.24);
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(180,214,255,.72));
      box-shadow: inset 0 1px 0 white, 0 6px 16px rgba(50,90,130,.14);
    }
    .nav { display: flex; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .nav a { padding: 9px 13px; border-radius: 999px; }
    .nav a:hover, .nav a[aria-current="page"] { background: rgba(255,255,255,.55); color: var(--navy); }
    main { flex: 1; padding: 70px 0 86px; }
    .eyebrow { margin: 0 0 12px; color: var(--blue); font: 600 10px Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--navy); font-size: clamp(38px, 7vw, 64px); line-height: 1.05; letter-spacing: -.04em; }
    .intro { max-width: 580px; margin: 16px 0 38px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; }
    .project-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 24px;
      background: rgba(255,255,255,.66);
      box-shadow: 0 18px 40px rgba(46,83,125,.14), inset 0 1px 0 white;
      backdrop-filter: blur(12px);
    }
    .project-art {
      min-height: 220px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(20,79,128,.18), rgba(255,255,255,.08)),
        url("/static/frutiger-aero-landscape.png") center / cover;
    }
    .project-art img { width: 100%; height: 220px; object-fit: cover; }
    .project-logo {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(255,255,255,.86), rgba(218,237,255,.6));
      box-shadow: inset 0 2px 0 white, 0 14px 28px rgba(24,69,108,.22);
      color: var(--navy);
      font-size: 37px;
      font-weight: 700;
    }
    .project-content { padding: 24px; }
    .project-type { margin: 0 0 9px; color: var(--blue); font: 600 9px Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .project-content h2 { margin: 0 0 10px; color: var(--navy); font-size: 24px; }
    .project-content > p:not(.project-type) { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 17px; }
    .tags span { padding: 6px 10px; border: 1px solid rgba(91,126,174,.22); border-radius: 999px; background: rgba(224,239,255,.64); color: var(--navy); font-size: 10px; }
    .project-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; color: #416fa8; font-size: 12px; font-weight: 700; }
    .project-link:hover { color: var(--navy); }
    .project-empty, .project-error { grid-column: 1 / -1; padding: 28px; border: 1px solid rgba(255,255,255,.8); border-radius: 18px; background: rgba(255,255,255,.55); color: var(--muted); line-height: 1.7; text-align: center; }
    .site-footer { min-height: 70px; display: flex; align-items: center; border-top: 1px solid rgba(90,120,160,.2); background: white; color: var(--muted); font-size: 10px; }
    @media (max-width: 520px) {
      .shell { width: calc(100% - 30px); }
      .site-header { min-height: 66px; }
      .nav { gap: 0; font-size: 10px; }
      main { padding: 48px 0 60px; }
      .project-art { min-height: 180px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="LonoBlog home"><span class="brand-mark" aria-hidden="true">L</span><span>LonoBlog</span></a>
      <nav class="nav" aria-label="Main navigation"><a href="/">Home</a><a href="/blog">The blog</a><a href="/projects" aria-current="page">Projects</a></nav>
    </header>
    <main>
      <p class="eyebrow">Things I make</p>
      <h1>Projects</h1>
      <p class="intro">A little collection of things I’ve built and the ideas behind them.</p>
      <section class="project-grid" id="project-grid" aria-label="Featured projects" aria-live="polite">
        <p class="project-empty">Loading projects...</p>
      </section>
    </main>
  </div>
  <footer class="site-footer"><div class="shell">LonoBlog · Anas’s projects</div></footer>
  <script>
    const projectGrid = document.querySelector("#project-grid");

    function renderProjects(projects) {
      projectGrid.replaceChildren();
      if (!projects.length) {
        const empty = document.createElement("p");
        empty.className = "project-empty";
        empty.textContent = "Projects will appear here soon.";
        projectGrid.append(empty);
        return;
      }

      projects.forEach((project) => {
        const card = document.createElement("article");
        card.className = "project-card";
        const art = document.createElement("div");
        art.className = "project-art";
        if (project.image) {
          const image = document.createElement("img");
          image.src = project.image;
          image.alt = `${project.name} project`;
          image.loading = "lazy";
          image.decoding = "async";
          art.append(image);
        } else {
          art.setAttribute("aria-hidden", "true");
          const logo = document.createElement("div");
          logo.className = "project-logo";
          logo.textContent = project.kind === "Electronics" ? "⌁" : "</>";
          art.append(logo);
        }

        const content = document.createElement("div");
        content.className = "project-content";
        const kind = document.createElement("p");
        kind.className = "project-type";
        kind.textContent = project.kind;
        const title = document.createElement("h2");
        title.textContent = project.name;
        const description = document.createElement("p");
        description.textContent = project.description;
        content.append(kind, title, description);

        if (project.technologies.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          tags.setAttribute("aria-label", "Technologies or components");
          project.technologies.forEach((technology) => {
            const tag = document.createElement("span");
            tag.textContent = technology;
            tags.append(tag);
          });
          content.append(tags);
        }

        if (project.link) {
          const link = document.createElement("a");
          link.className = "project-link";
          link.href = project.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.append(document.createTextNode("View project "));
          const arrow = document.createElement("span");
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(arrow);
          content.append(link);
        }

        card.append(art, content);
        projectGrid.append(card);
      });
    }

    fetch("/api/public/projects", { headers: { Accept: "application/json" } })
      .then((response) => {
        if (!response.ok) throw new Error("The project list could not be loaded.");
        return response.json();
      })
      .then(renderProjects)
      .catch(() => {
        projectGrid.replaceChildren();
        const error = document.createElement("p");
        error.className = "project-error";
        error.textContent = "Projects could not be loaded right now. Please refresh to try again.";
        projectGrid.append(error);
      });
  </script>
</body>
</html>
